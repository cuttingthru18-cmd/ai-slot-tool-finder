name: 🔗 Dead link
description: A tool in the machine is gone or broken
labels: [dead-links]
body:
  - type: input
    id: tool
    attributes:
      label: Tool name
      placeholder: e.g. Radio Garden
    validations:
      required: true
  - type: input
    id: what
    attributes:
      label: What happens when you open it?
      placeholder: 404 / domain for sale / redirects to spam...
    validations:
      required: true
