name: Weekly dead-link check
on:
  schedule:
    - cron: "0 13 * * 1"   # every Monday 13:00 UTC (~9am Detroit)
  workflow_dispatch:
jobs:
  linkcheck:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Check all tool links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-concurrency 8 --timeout 20 --accept 200..399,403,429 index.html
          fail: false
      - name: Open issue if dead links found
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "🔗 Dead links detected — machine needs maintenance"
          content-filepath: ./lychee/out.md
          labels: dead-links, automated
