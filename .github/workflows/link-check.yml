name: Weekly dead-link check
on:
  schedule:
    - cron: "0 13 * * 1"   # every Monday 13:00 UTC (~9am Detroit)
  workflow_dispatch:
jobs:
  linkcheck:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Every tool URL lives inside the TOYS array in index.html, NOT in an <a href>.
      # This job used to point lychee at index.html: it found TWO links, passed, and
      # reported green every Monday from 2026-07-09 while checking nothing. Four links
      # were dead the whole time. Read the data, not the markup.
      - name: Check every tool URL in tools.json
        id: check
        run: python3 scripts/check_links.py
        continue-on-error: true

      - name: A broken checker is not a clean site
        if: steps.check.outcome == 'failure' && hashFiles('dead-links.md') == ''
        run: |
          echo "::error::check_links.py exited non-zero but wrote no dead-links.md."
          echo "::error::That is a crashed checker, not a healthy machine. Failing loudly."
          exit 1

      - name: Open issue if dead links found
        if: hashFiles('dead-links.md') != ''
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "🔗 Dead links detected — machine needs maintenance"
          content-filepath: ./dead-links.md
          labels: dead-links, automated
